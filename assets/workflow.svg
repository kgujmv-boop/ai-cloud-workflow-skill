<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc"><title id="title">从需求到可靠交付</title><desc id="desc">了解需求、比较方案、核实连接、分工执行、检查交付。每一步依据实际能力和有效授权。</desc><rect width="1100" height="260" rx="20" fill="#0e1b2b"/><rect x="28" y="38" width="188" height="166" rx="15" fill="#142c3a" stroke="#315465"/><text x="46" y="77" fill="#5eead4" font-family="sans-serif" font-size="18">01</text><text x="46" y="119" fill="#eef7fa" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="600">了解需求</text><text x="46" y="153" fill="#afc4d1" font-family="sans-serif" font-size="13">Goal &amp; constraints</text><path d="M223 120h12m-5-5 5 5-5 5" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="242" y="38" width="188" height="166" rx="15" fill="#142c3a" stroke="#315465"/><text x="260" y="77" fill="#5eead4" font-family="sans-serif" font-size="18">02</text><text x="260" y="119" fill="#eef7fa" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="600">比较方案</text><text x="260" y="153" fill="#afc4d1" font-family="sans-serif" font-size="13">Free-first research</text><path d="M437 120h12m-5-5 5 5-5 5" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="456" y="38" width="188" height="166" rx="15" fill="#142c3a" stroke="#315465"/><text x="474" y="77" fill="#5eead4" font-family="sans-serif" font-size="18">03</text><text x="474" y="119" fill="#eef7fa" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="600">核实连接</text><text x="474" y="153" fill="#afc4d1" font-family="sans-serif" font-size="13">Relevant access</text><path d="M651 120h12m-5-5 5 5-5 5" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="670" y="38" width="188" height="166" rx="15" fill="#142c3a" stroke="#315465"/><text x="688" y="77" fill="#5eead4" font-family="sans-serif" font-size="18">04</text><text x="688" y="119" fill="#eef7fa" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="600">分工执行</text><text x="688" y="153" fill="#afc4d1" font-family="sans-serif" font-size="13">Dispatch &amp; checkpoint</text><path d="M865 120h12m-5-5 5 5-5 5" stroke="#5eead4" fill="none" stroke-width="2"/><rect x="884" y="38" width="188" height="166" rx="15" fill="#142c3a" stroke="#315465"/><text x="902" y="77" fill="#5eead4" font-family="sans-serif" font-size="18">05</text><text x="902" y="119" fill="#eef7fa" font-family="Noto Sans CJK SC,sans-serif" font-size="25" font-weight="600">检查交付</text><text x="902" y="153" fill="#afc4d1" font-family="sans-serif" font-size="13">Verify &amp; recover</text><text x="550" y="237" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" font-size="16" fill="#afc4d1">按实际能力执行 · 根据有效授权操作 · 中断后先核实再恢复</text></svg>