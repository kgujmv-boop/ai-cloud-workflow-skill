name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    # Standard runners are free for public repositories. Do not run on private copies.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test manifest rules
        run: python -m unittest discover -s tests -v
      - name: Exercise CPU checkpoint and recovery
        shell: bash
        run: |
          parent="$(mktemp -d "$RUNNER_TEMP/cpu-proof.XXXXXX")"
          python examples/cpu-recovery/test_cpu_checkpoint_demo.py --workspace "$parent/run"
          python - "$parent/run/run-proof.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              proof = json.load(handle)
          assert proof["status"] == "PASS"
          print("CPU checks:", proof["test_count"])
          print("Final SHA-256:", proof["final_sha256"])
          PY
      - name: Inspect local reuse fixture
        shell: bash
        run: |
          parent="$(mktemp -d "$RUNNER_TEMP/reuse-proof.XXXXXX")"
          python scripts/inspect_reuse.py \
            --root examples/local-reuse/workspace \
            --baseline examples/local-reuse/baseline.json \
            --current examples/local-reuse/current.json \
            --baseline-sha256 85681bbc611bb2138c4a7a243314e252d3e34ae3c9094f87132c564a8d99b108 \
            --trust-baseline \
            --report "$parent/reuse-report.json"
